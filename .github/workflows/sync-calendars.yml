name: Synchroniser les calendriers

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures
  workflow_dispatch:        # bouton « Run workflow » pour forcer une mise à jour

permissions:
  contents: write

concurrency:
  group: sync-calendars
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les iCal
        env:
          ICAL_VUE: ${{ secrets.ICAL_VUE }}
        run: python scripts/sync_ical.py
      - name: Enregistrer les disponibilités
        run: |
          git config user.name "25dayz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add availability
          git diff --cached --quiet || (git commit -m "Disponibilités mises à jour" && git push)
